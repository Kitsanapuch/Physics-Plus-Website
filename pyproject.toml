[project]
name = "physics-plus-website"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "turso_serverless==0.1.0",
  "libsql==0.1.11",
  "tzdata>=2025.2",
  "reportlab>=4.4,<5",
  "google-auth[requests]>=2.35,<3",
  "vercel-queue[typed]==0.9.2",
]

[tool.uv]
package = false

[[tool.vercel.subscribers]]
entrypoint = "queue_worker:drain_delivery_signal"
topics = ["physics-plus-delivery"]
